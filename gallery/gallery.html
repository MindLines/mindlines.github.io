{ id: 35, title: "ИИ материалы", desc: "Примеры промптов для&nbsp;замены материалов. В&nbsp;данном способе используется такая&nbsp;же solid shade болванка, как в&nbsp;<a href=\"#post-36\" class=\"modal-link permanent-underline\">этом методе</a>. Это позволяет сохранить форму объекта и&nbsp;единство шрифта между всеми цифрами.<br><br>Голубая глазурь: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">Change the material to a 3D material with a thick, blue strawberry glaze finish. The surface is smooth, soft like a clay, and slightly reflective, resembling cream donut frosting or a clay for kids. Embedded throughout the material are small, colorful 3D candy decorations: matte yellow stars, vibrant blue and orange rings, and multicolored cylindrical sprinkles. The lighting is bright studio-style with soft ambient occlusion to emphasize the plump, volumetric depth and creamy texture. White background.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Эко-стиль: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">3D number \"0\", covered in lush eco-green leaves and vibrant grass, fresh forest green tones, organic layered growth, bold and natural form, centered on a solid white background, minimalistic 3D rendering, soft natural lighting. Keep the original reference shape and angle.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Текстурированный с&nbsp;градиентом: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">A 3D rendered number 0 object with orange metallic texture, created in Blender. A high-quality render with soft shadows and subtle reflections, featuring a glossy surface and isolated on a white background. The piece has a minimalistic composition with smooth and reflective material.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Гжельская роспись: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">Swap the material of the 3D % symbol to glossy blue-white porcelain in the traditional Gzhel style. The symbol is decorated with iconic cobalt blue patterns featuring intricate flowers, leaves, and scrolls. Incorporate smooth blue-to-light-blue gradients and delicate fine-line detailing. The object is suspended in the air on a white background, preserving a clear shape with a polished ceramic finish.</span></div><span class=\"expand-toggle\">Развернуть</span>", aspect: "horizontal", mediaType: "image", imageSrc: "AI numbers.png", thumbnailSrc: "AI numbers.png", tags: "ai,3d,blender,photoshop", tools: "", category: "Нейросети", score: 7 },
{ id: 36, title: "ИИ замена материала solid shade объекта.", desc: "Лучший способ сохранить детали объекта с&nbsp;минимумом искажений — это использовать в&nbsp;качестве референса solid shade версию объекта. Можно сделать viewport render 3D-модели. Или, если это изображение — поменять стиль на&nbsp;solid shade.<br><br>Замена материала картинки на&nbsp;solid shade:<br><span class=\"clickable-prompt\">Make a 3D Solid viewport mode shading render style version of this image. No colors. Solid black bacground.</span><br><br>Solid shade → Оранжевый чемодан: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">A high-quality 3D product render of a modern hardshell rolling suitcase, bright orange textured ABS plastic shell with vertical ridges, sleek metallic silver telescopic handle, dark charcoal rubberized spinner wheels, professional studio lighting with soft shadows, 8k resolution, photorealistic materials, isolated on a solid black background.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Solid shade → Frosted glass: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">Transform this suitcase into a high-end designer object made entirely of heavy, translucent frosted glass. The vertical ribs should be sharp and catch the light, creating a prismatic effect. Incorporate realistic caustic light patterns reflecting through the glass body onto the dark background. The handle and wheels should be made of polished, transparent crystal. Maintain the exact 3D perspective and minimalist composition of the original. 8k resolution, cinematic studio lighting, hyper-realistic glass textures.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Solid shade → Прозрачное стекло:<br><span class=\"clickable-prompt\">Change the material of the suitcase into a clear, minimalistic see through glass. No floor, the object should be suspended in the air. Minimalistic C4D render style. minimalist black background. Avoid overdetailed overlaping of transparent elements.</span><br><br>Прозрачное стекло → Заполнение цветами: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">A hyper-realistic 3D render of a clear, transparent acrylic suitcase filled with a vibrant, dense variety of fresh flowers, including orange and pink Gerberas, yellow chrysanthemums, and white roses. The suitcase has a sleek, translucent handle and wheels. Isolated on a solid black background, studio lighting, high contrast, cinematic detail.</span></div><span class=\"expand-toggle\">Развернуть</span>", aspect: "horizontal", thumbnailAspect: "vertical-4x5", mediaType: "image", imageSrc: "AI Suitcase.png", thumbnailSrc: "AI suitcase cover.png", tags: "ai,3d,blender,photoshop", tools: "", category: "Нейросети", score: 10 },
{ id: 37, title: "ИИ продуктовые фотографии", desc: "Примеры промптов для&nbsp;продуктовой съемки с&nbsp;использованием референса продукта, на&nbsp;примере <a href=\"#post-28\" class=\"modal-link permanent-underline\">моего концепта</a> для&nbsp;сыворотки.<br><br>Наклонная композиция у&nbsp;зеркала: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">Diagonal tilted composition with emphasis on balance and tension: The object is tilted at an angle of ~30–45° to the right (from vertical), resting on one edge on a round mirror with a thin metallic rim. The mirror occupies ~50–60% of the frame diagonally. The round mirror levitates in the lower third of the frame, with part of it cut off by the right edge. Vertical format, object centered but with asymmetry for dynamism (the reflection adds symmetry from below). The reflection in the mirror shows the bottom of the object and part of the body, creating a \"duplicate\". No other elements — the scene is minimalist, the object \"balances\" without visible support. Dramatic gradient light — main source in the upper left corner (bottom-up, like moonlight or glow), creating a strong gradient and glow around the bottle. Rim / contour light from the top left emphasizes the contours of the mirror and glass, adding bright specular highlights on the liquid and cap. Medium contrast: soft shadows under the object, the bottle looks radiant without harsh overexposure. Lighting enhances the deep violet-purple color. Post-processing effects: Strong color grading and vignette — the background gradient is intensified. Light blur/softness at the edges (gaussian blur on the mirror), but sharpness on the object. Increased saturation of violet-purple tones, S-curve for contrast on the label and liquid. Reflections enhanced, minimal noise, highlight retouching for a \"liquid\" effect. Reflection composite for perfect symmetry. Full-frame camera + macro lens (100 mm macro or 85 mm tilt-shift). Aperture f/4–f/8. Shutter speed 1/60–1/200 (studio light), ISO 100–200. Low angle shot for mirror dynamics. CGI/render.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Hero shot: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">A premium organic skincare product hero shot of a purple serum bottle with a black dropper cap. The bottle is standing on a thin, matte, semi-transparent deep violet glass shelf with a dark glossy edge. The shelf is positioned at a 30-degree angle from the bottom left to the right, with the front edge visible. The bottle is positioned so that half of its base protrudes over the edge of the shelf. The background is a soft, contrasting gradient of light dusty lavender. The scene is lit with a soft, diffused warm key light from the bottom left, creating soft shadows, while a bright rim light from behind the bottle creates strong, beautiful specular highlights along its glass contour. The image has a minimalist, warm, and quiet luxury aesthetic, conveying a high-end botanical wellness mood. Professional studio photography with a 100mm macro lens at f/5.6, resulting in a tack-sharp focus and ultra-sharp details with no blur.</span></div><span class=\"expand-toggle\">Развернуть</span><br><br>Продукт в&nbsp;руках в&nbsp;затенённой сцене: <div class=\"prompt-container collapsed\"><span class=\"clickable-prompt\">Cinematic backlit shot, silhouette of elegant slender female hands with long graceful nails holding the object in an artistic elegant composition, raising the bottle to the sky, liquid glowing, strong gradient background light top to dark bottom, intense contre-jour lighting silhouetting hands in black with rim highlights on the bottle, ethereal luxury mood, hyperrealistic details on glass and hands, professional fragrance campaign, 85mm lens f/4, sharp focus on bottle, tack sharp textures. The image is executed in the style of minimalist luxury product photography with elements of futurism and drama. Depth of field: Shallow depth of field with focus on the product — device sharp, background softly blurred for isolation. Color scheme is gradient and intense: from dark violet-plum at the bottom to bright light lavender-violet at the top, with soft violet accents on the device. Add glow around the product for drama. Effects: Light bloom (light scattering) imitating internal glow. Lighting type: Dramatic gradient lighting with directional sources — low-key moody in the lower part and high-key at the top. Sources: Key light from right/above with deep violet gels for the gradient, weaker fill light on the left to fill shadows on the body. Effects: Lighting imitates \"moonlight\" or \"lunar energy\" — the gradient creates an illusion of movement, the product \"glows\" from within. Mixed color temperature. Everything is balanced, the eye is drawn from the dark bottom to the bright top. Overall effect — static yet dynamic thanks to the gradient, ideal for branding.</span></div><span class=\"expand-toggle\">Развернуть</span>", aspect: "horizontal", thumbnailAspect: "vertical-4x5", mediaType: "image", imageSrc: "Serum photo guide.png", thumbnailSrc: "Serum photo.png", tags: "ai", category: "Нейросети", score: 8 }

        // Function to create a media card element
        function createMediaCard(item) {
            const card = document.createElement('a');
            card.className = 'media-card';
            card.href = `#post-${item.id}`; // Make it a link to the post
            card.setAttribute('data-title', item.title);
            card.setAttribute('data-desc', item.desc);
            card.setAttribute('data-aspect', item.aspect);
            card.setAttribute('data-id', item.id);

            if (item.mediaType) {
                card.setAttribute('data-media-type', item.mediaType);
            }
            if (item.videoId) {
                card.setAttribute('data-video-id', item.videoId);
            }
            if (item.videoSrc) {
                card.setAttribute('data-video-src', item.videoSrc);
            }
            if (item.thumbnailVideoSrc) {
                card.setAttribute('data-thumbnail-video-src', item.thumbnailVideoSrc);
            }
            if (item.extraGalleryHeroImage) {
                card.setAttribute('data-extra-gallery-hero-image', item.extraGalleryHeroImage);
            }
            if (item.imageSrc) {
                card.setAttribute('data-image-src', item.imageSrc);
            }
            if (item.images) {
                card.setAttribute('data-images', item.images);
            }
            if (item.extraImages) {
                card.setAttribute('data-extra-images', item.extraImages);
            }
            if (item.tags) {
                card.setAttribute('data-tags', item.tags);
            }
            if (item.tools) {
                card.setAttribute('data-tools', item.tools);
            }
            if (item.category) {
                card.setAttribute('data-category', item.category);
            }
            if (item.filterCategory) {
                card.setAttribute('data-filter-category', item.filterCategory);
            }
            const normalizedScore = Number.isFinite(parseInt(item.score, 10)) ? parseInt(item.score, 10) : 0;
            card.setAttribute('data-score', normalizedScore);

            // Create click overlay
            const clickOverlay = document.createElement('div');
            clickOverlay.className = 'click-overlay';
            card.appendChild(clickOverlay);

            // Create media container
            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-container';

            // Create aspect ratio box - use thumbnailAspect if specified, otherwise fall back to aspect
            const cardAspect = item.thumbnailAspect || item.aspect;
            const aspectBox = document.createElement('div');
            aspectBox.className =
                cardAspect === 'vertical' ? 'aspect-ratio-box-vertical' :
                cardAspect === 'vertical-4x5' ? 'aspect-ratio-box-4x5' :
                cardAspect === 'square-vertical' ? 'aspect-ratio-box-square' :
                'aspect-ratio-box';

            if (item.thumbnailVideoSrc) {
                const previewPoster = item.thumbnailSrc || item.extraGalleryHeroImage || (item.extraImages ? item.extraImages.split(',')[0].trim() : '');

                // For problematic browsers on post 27, use static image instead of autoplay video
                if (needsVideoWorkaround() && item.id === 27) {
                    const img = document.createElement('img');
                    img.src = '../assets/project cards/3D графика/Terminal.png';
                    img.alt = item.title;
                    img.className = 'media-image';
                    img.loading = 'lazy';
                    aspectBox.appendChild(img);
                    // Show play button for problematic browsers (override CSS display:none)
                    const playButton = document.createElement('div');
                    playButton.className = 'play-button';
                    playButton.style.display = 'flex';
                    aspectBox.appendChild(playButton);
                // For problematic browsers on post 28, use static image instead of autoplay video
                } else if (needsVideoWorkaround() && item.id === 28) {
                    const img = document.createElement('img');
                    img.src = '../assets/project cards/3D графика/Serum.png';
                    img.alt = item.title;
                    img.className = 'media-image';
                    img.loading = 'lazy';
                    aspectBox.appendChild(img);
                    // Show play button for problematic browsers with post 26 style
                    const playButton = document.createElement('div');
                    playButton.className = 'play-button';
                    playButton.style.display = 'flex';
                    playButton.style.background = 'rgba(148, 148, 148, 0.42)';
                    playButton.style.backdropFilter = 'blur(3px)';
                    aspectBox.appendChild(playButton);
                } else {
                    const previewVideo = document.createElement('video');
                    previewVideo.src = 'vids/' + item.thumbnailVideoSrc;
                    previewVideo.autoplay = true;
                    previewVideo.loop = true;
                    previewVideo.muted = true;
                    previewVideo.defaultMuted = true;
                    previewVideo.playsInline = true;
                    previewVideo.preload = 'auto';
                    previewVideo.controls = false;
                    previewVideo.setAttribute('muted', '');
                    previewVideo.setAttribute('playsinline', '');
                    previewVideo.setAttribute('webkit-playsinline', '');
                    previewVideo.disablePictureInPicture = true;
                    previewVideo.disableRemotePlayback = true;
                    previewVideo.className = 'media-image';
                    previewVideo.setAttribute('aria-label', item.title);
                    if (previewPoster) {
                        previewVideo.poster = 'img and gif posts/' + previewPoster;
                    }
                    previewVideo.addEventListener('loadeddata', () => {
                        previewVideo.play().catch(() => {});
                    }, { once: true });
                    previewVideo.addEventListener('canplay', () => {
                        previewVideo.play().catch(() => {});
                    }, { once: true });
                    previewVideo.load();

                    aspectBox.appendChild(previewVideo);
                }
            } else {
            // Create image - use thumbnailSrc if specified, otherwise use imageSrc or grouped images
            const img = document.createElement('img');
            if (item.thumbnailSrc) {
                img.src = 'img and gif posts/' + item.thumbnailSrc;
            } else if (item.mediaType === 'image') {
                let imageFilename;
                if (item.images) {
                    // For grouped images, use the first image for the thumbnail
                    imageFilename = item.images.split(',')[0];
                } else {
                    // Fall back to imageSrc
                    imageFilename = item.imageSrc;
                }
                img.src = 'img and gif posts/' + imageFilename;
            } else {
                img.src = 'Обложки/' + item.thumbnail;
            }
            img.alt = item.title;
            img.className = 'media-image';
            img.loading = 'lazy';

            aspectBox.appendChild(img);
            }

            // Add play button for videos
            if (!item.mediaType || item.mediaType !== 'image') {
                const playButton = document.createElement('div');
                playButton.className = 'play-button';
                aspectBox.appendChild(playButton);
            }

            mediaContainer.appendChild(aspectBox);
            card.appendChild(mediaContainer);

            return card;
        }

        // Function to get responsive column count based on screen size
        function getResponsiveColumnCount() {
            const viewportWidth = window.innerWidth;

            // Responsive breakpoints
            if (viewportWidth >= 1200) {
                return 5; // Desktop - Pinterest-style waterfall
            } else if (viewportWidth >= 768) {
                return 3; // Tablet
            } else {
                return 2; // Mobile
            }
        }

        // --- LAYOUT SETTINGS LOGIC ---
        function applyMasonryLayout() {
            const allElements = Array.from(gallery.children);
            // Only position visible cards (not hidden by filters) and separators
            const mediaCards = allElements.filter(el =>
                el.classList.contains('media-card') && el.style.display !== 'none'
            );
            const separators = allElements.filter(el => el.classList.contains('filter-separator'));

            const containerWidth = gallery.offsetWidth;
            const columnCount = getResponsiveColumnCount(); // Dynamic column count
            const gutterSize = 15; // Uniform gutter size for all devices
            const cardWidth = (containerWidth - (gutterSize * (columnCount - 1))) / columnCount;

            // Initialize column heights array
            const columnHeights = new Array(columnCount).fill(0);

            allElements.forEach(element => {
                if (element.classList.contains('filter-separator')) {
                    const currentMaxHeight = Math.max(...columnHeights);
                    element.style.position = 'absolute';
                    element.style.left = '0';
                    element.style.top = currentMaxHeight + 'px';
                    element.style.width = '100%';

                    const separatorHeight = element.offsetHeight || 60;
                    for (let col = 0; col < columnCount; col++) {
                        columnHeights[col] = currentMaxHeight + separatorHeight + gutterSize + 50;
                    }
                } else if (element.classList.contains('media-card')) {
                    if (element.style.display === 'none') {
                        return;
                    }

                    const shortestCol = columnHeights.indexOf(Math.min(...columnHeights));
                    const left = shortestCol * (cardWidth + gutterSize);
                    element.style.position = 'absolute';
                    element.style.width = cardWidth + 'px';
                    element.style.left = left + 'px';
                    element.style.top = columnHeights[shortestCol] + 'px';

                    const cardHeight = element.offsetHeight;
                    columnHeights[shortestCol] += cardHeight + gutterSize;
                }
            });

            gallery.style.height = Math.max(...columnHeights) + 'px';
        }

        // --- DYNAMIC ASPECT RATIO CALCULATION FOR IMAGES ---
        function adjustImageAspectRatios() {
            const imageCards = document.querySelectorAll('.media-card[data-media-type="image"]');

            imageCards.forEach(card => {
                const img = card.querySelector('img');
                const aspectBox = card.querySelector('.aspect-ratio-box, .aspect-ratio-box-vertical');

                if (img && aspectBox) {
                    // If image is already loaded, adjust immediately
                    if (img.complete && img.naturalWidth > 0) {
                        adjustAspectRatio(img, aspectBox);
                    } else {
                        // Wait for image to load
                        img.addEventListener('load', function() {
                            adjustAspectRatio(img, aspectBox);
                            // Recalculate masonry layout after aspect ratio change
                            setTimeout(applyMasonryLayout, 50);
                        });
                    }
                }
            });
        }

        function adjustAspectRatio(img, aspectBox) {
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;

            if (naturalWidth > 0 && naturalHeight > 0) {
                const aspectRatio = naturalHeight / naturalWidth;
                const paddingBottom = aspectRatio * 100;

                // Apply dynamic aspect ratio
                aspectBox.style.paddingBottom = paddingBottom + '%';

                // Ensure image fills the container properly
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'contain'; // Changed from 'cover' to 'contain' to prevent cropping
            }
        }

        // Function to initialize gallery with media cards
        function initializeGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = ''; // Clear existing content

            mediaItems.forEach((item, index) => {
                const card = createMediaCard(item);
                card.setAttribute('data-original-index', index);
                gallery.appendChild(card);
            });

            // Apply masonry layout immediately after creating cards
            setTimeout(() => {
                try {
                    applyMasonryLayout();
                } catch (error) {
                    console.error('Error applying masonry layout:', error);
                }

                try {
                    adjustImageAspectRatios();
                } catch (error) {
                    console.error('Error adjusting image aspect ratios:', error);
                }

                // Note: Gallery will be revealed after ALL initialization is complete
            }, 50);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const shouldLockInitialViewportToTop =
                window.innerWidth <= 768 &&
                !window.location.hash.startsWith('#post-');
            let userMovedViewport = false;

            function keepInitialViewportAtTop() {
                if (!shouldLockInitialViewportToTop || userMovedViewport) {
                    return;
                }

                window.scrollTo({
                    top: 0,
                    left: 0,
                    behavior: 'auto'
                });
            }

            if (shouldLockInitialViewportToTop) {
                window.addEventListener('scroll', function() {
                    if (window.scrollY > 4) {
                        userMovedViewport = true;
                    }
                }, { passive: true });

                requestAnimationFrame(() => {
                    requestAnimationFrame(keepInitialViewportAtTop);
                });

                window.addEventListener('load', function() {
                    setTimeout(keepInitialViewportAtTop, 0);
                }, { once: true });
            }

            // Check if we need to open a specific post from URL hash
            const hash = window.location.hash;
            if (hash.startsWith('#post-')) {
                const postId = hash.substring(6); // Remove '#post-'
                const postIndex = mediaItems.findIndex(item => item.id.toString() === postId);
                if (postIndex !== -1) {
                    // Small delay to ensure gallery is fully loaded
                    setTimeout(() => {
                        openPostByIndex(postIndex);
                    }, 500);
                }
            }

            const gallery = document.getElementById('gallery');

            const postModal = document.getElementById('postModal');
            const modalVideo = postModal.querySelector('.modal-video');
            const modalTitle = postModal.querySelector('.post-title');
            const modalDesc = postModal.querySelector('.post-desc');
            const modalExtraGallery = document.getElementById('modalExtraGallery');
            const modalExtraGalleryTrack = modalExtraGallery.querySelector('.modal-extra-gallery-track');

            // --- FILTERING SYSTEM ---
            const activeCategoryFilters = new Set();
            const activeToolFilters = new Set();
            const activeTypeFilters = new Set();

            // Function to clear ALL active filters from ALL groups (unified radio behavior)
            function clearAllActiveFilters() {
                // Clear all filter sets
                activeCategoryFilters.clear();
                activeToolFilters.clear();
                activeTypeFilters.clear();

                // Remove active class from ALL filter buttons
                document.querySelectorAll('.filter-btn, .sort-btn').forEach(btn => btn.classList.remove('active'));
            }

            // Function to initialize filter state to match visual state on page load
            function initializeFilterState() {
                // Always ensure "Все" filter is active on page load
                const allButton = document.getElementById('sortRandom');
                toggleTypeFilter('all', allButton);
            }

            // Function to check if a card matches the current filters
            function cardMatchesFilters(card) {
                const cardCategory = card.getAttribute('data-filter-category') || card.getAttribute('data-category') || '';
                const cardTools = card.getAttribute('data-tools') || '';
                const rawCardType = card.getAttribute('data-media-type');
                const cardType = !rawCardType || rawCardType === 'video-file' ? 'video' : rawCardType;

                // If no filters are active, show all cards
                if (activeCategoryFilters.size === 0 && activeToolFilters.size === 0 && activeTypeFilters.size === 0) {
                    return true;
                }

                let categoryMatch = activeCategoryFilters.size === 0;
                let toolMatch = activeToolFilters.size === 0;
                let typeMatch = activeTypeFilters.size === 0;

                // Check category filters
                if (activeCategoryFilters.size > 0) {
                    for (const filter of activeCategoryFilters) {
                        if (cardCategory.includes(filter)) {
                            categoryMatch = true;
                            break;
                        }
                    }
                }

                // Check tool filters
                if (activeToolFilters.size > 0) {
                    for (const filter of activeToolFilters) {
                        if (cardTools.includes(filter)) {
                            toolMatch = true;
                            break;
                        }
                    }
                }

                // Check type filters
                if (activeTypeFilters.size > 0) {
                    for (const filter of activeTypeFilters) {
                        if (cardType === filter) {
                            typeMatch = true;
                            break;
                        }
                    }
                }

                // Card must match ALL active filter groups (AND logic between categories, tools, and types)
                return categoryMatch && toolMatch && typeMatch;
            }

            // Function to apply filters to visible cards (reorders instead of hiding)
            function applyFilters() {
                const cards = Array.from(gallery.querySelectorAll('.media-card'));
                const matchingCards = [];
                const nonMatchingCards = [];

                // Separate cards into matching and non-matching
                cards.forEach(card => {
                    if (cardMatchesFilters(card)) {
                        matchingCards.push(card);
                    } else {
                        nonMatchingCards.push(card);
                    }
                });

                // Clear gallery
                gallery.innerHTML = '';

                // Add matching cards first
                matchingCards.forEach(card => {
                    gallery.appendChild(card);
                });

                // Add separator if there are both matching and non-matching cards
                if (matchingCards.length > 0 && nonMatchingCards.length > 0) {
                    const separator = document.createElement('div');
                    separator.className = 'filter-separator';
                    separator.innerHTML = `

                        <div class="separator-text-container">
                            <div class="separator-text">Другие работы</div>
                        </div>
                        <div class="separator-line"></div>
                    `;
                    gallery.appendChild(separator);

                    // Fade in separator after layout is calculated
                    setTimeout(() => {
                        separator.classList.add('visible');
                    }, 100);
                }

                // Add non-matching cards
                nonMatchingCards.forEach(card => {

            // Function to parse tags into category and tools
            function parseTagsForModal(tags) {
                if (!tags) return { category: '', tools: '' };

                const tagArray = tags.split(',').map(tag => tag.trim().toLowerCase());

                // Category mappings (these represent the type of work)
                const categoryMappings = {
                    'motion-design': 'Моушн-дизайн',
                    '2d': '3D-графика',
                    '3d': '3D-анимация',
                    'illustrations': '2D-иллюстрации',
                    'avatars': 'Аватары',
                    'football-characters': 'Персонажи'
                };

                // Tools mappings (these represent software/tools used)
                const toolMappings = {
                    'illustrator': 'Illustrator',
                    'after-effects': 'After Effects',
                    'photoshop': 'Photoshop',
                    'blender': 'Blender',
                    'cinema4d': 'Cinema 4D',
                    'c4d': 'Cinema 4D',
                    'ai': 'AI'
                };

                // Extract categories (work types)
                const categories = tagArray
                    .filter(tag => categoryMappings[tag])
                    .map(tag => categoryMappings[tag]);

                // Extract tools (software)
                const tools = tagArray
                    .filter(tag => toolMappings[tag])
                    .map(tag => toolMappings[tag]);

                // Format category string (combine with · separator)
                const categoryStr = categories.length > 0 ? categories.join(' · ') : '';

                // Format tools string (combine with · separator)
                const toolsStr = tools.length > 0 ? tools.join(' · ') : '';

                return {
                    category: categoryStr,
                    tools: toolsStr
                };
            }

            // Function to convert text entries to clickable links
            function convertToLinks(text) {
                if (!text) return '';
                const entries = text.split(' · ');
                return entries.map(entry => {
                    if (entry === 'Nano Banana' || entry === 'Cinema 4D' || entry === 'Figma') {
                        return '<span class="unclickable-tag">' + entry + '</span>';
                    }
                    return `<a href="#" class="modal-link">${entry}</a>`;
                }).join(' · ');
            }

            // Function to preload images for modal sizing
            function preloadImagesForModal(imageSrc, images) {
                return new Promise((resolve) => {
                    const imagesToLoad = [];

                    if (images) {
                        // Grouped images - preload all
                        const imageArray = images.split(',');
                        imageArray.forEach(imgSrc => {
                            imagesToLoad.push('img and gif posts/' + imgSrc.trim());
                        });
                    } else if (imageSrc) {
                        // Single image
                        imagesToLoad.push('img and gif posts/' + imageSrc);
                    }

                    if (imagesToLoad.length === 0) {
                        // No images to preload (video)
                        resolve(null);
                        return;
                    }

                    let loadedCount = 0;
                    const totalImages = imagesToLoad.length;
                    const sizingData = {
                        singleImage: null,
                        groupedImages: []
                    };

                    imagesToLoad.forEach((src, index) => {
                        const img = new Image();

                        img.onload = function() {
                            // Store sizing information
                            if (imagesToLoad.length === 1) {
                                // Single image
                                sizingData.singleImage = {
                                    naturalWidth: this.naturalWidth,
                                    naturalHeight: this.naturalHeight,
                                    aspectRatio: this.naturalHeight / this.naturalWidth
                                };
                            } else {
                                // Grouped images
                                sizingData.groupedImages[index] = {
                                    naturalWidth: this.naturalWidth,
                                    naturalHeight: this.naturalHeight,
                                    src: src
                                };
                            }

                            loadedCount++;
                            if (loadedCount === totalImages) {
                                // Store in sessionStorage for immediate access
                                sessionStorage.setItem('preloadedImageData', JSON.stringify(sizingData));
                                resolve(sizingData);
                            }
                        };

                        img.onerror = function() {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                // Store in sessionStorage even on error
                                sessionStorage.setItem('preloadedImageData', JSON.stringify(sizingData));
                                resolve(sizingData);
                            }
                        };

                        img.src = src;
                    });
                });
            }

            function updateModalLayoutState() {
                if (postModal.style.display !== 'flex') return;

                const modalStack = postModal.querySelector('.modal-stack');
                const mainModalContent = postModal.querySelector('.modal-content');
                if (!modalStack) return;

                const isMobile = window.innerWidth <= 768;
                const isLandscapeTablet =
                    window.innerWidth >= 769 &&
                    window.innerWidth <= 1366 &&
                    window.innerHeight <= 1024 &&
                    window.innerWidth > window.innerHeight;

                const aspect = postModal.dataset.aspect || '';
                const mediaType = postModal.dataset.mediaType || '';
                const isHorizontalImage = aspect === 'horizontal' && mediaType === 'image';
                const isVerticalVideo = aspect === 'vertical' && mediaType !== 'image';
                const isVertical4x5 = aspect === 'vertical-4x5';
                const isSquareVertical = aspect === 'square-vertical';
                const isLocalVerticalVideo = aspect === 'vertical' && mediaType === 'video-file';
                const isLocalVertical4x5Video = aspect === 'vertical-4x5' && mediaType === 'video-file';

                // Base fit check on the primary panel, not the whole stack, so extra galleries
                // don't push otherwise centered modals too low.
                const primaryPanelHeight = mainModalContent ? mainModalContent.offsetHeight : modalStack.scrollHeight;
                const fitsViewport = primaryPanelHeight + 40 <= window.innerHeight;

                let useTopLayout;
                if (isLandscapeTablet && (isLocalVerticalVideo || isLocalVertical4x5Video)) {
                    useTopLayout = true;
                } else if (isMobile || isLandscapeTablet) {
                    useTopLayout = !fitsViewport;
                } else if (isLocalVertical4x5Video) {
                    useTopLayout = true;
                } else if (isLocalVerticalVideo) {
                    useTopLayout = true;
                } else if (isVerticalVideo) {
                    useTopLayout = false;
                } else if (isVertical4x5) {
                    useTopLayout = false;
                } else if (isSquareVertical) {
                    useTopLayout = false;
                } else if (isHorizontalImage) {
                    useTopLayout = true;
                } else {
                    useTopLayout = !fitsViewport;
                }

                postModal.classList.remove('layout-centered', 'layout-top');
                postModal.classList.add(useTopLayout ? 'layout-top' : 'layout-centered');

                if (useTopLayout) {
                    postModal.scrollTop = 0;
                }
            }

            function sortMediaCards(cards, sortType) {

                    return parseInt(card.getAttribute('data-original-index'), 10) || 0;
                }

                return cardsArray.sort((a, b) => {
                    const scoreDiff = getScore(b) - getScore(a);
                    if (scoreDiff !== 0) return scoreDiff;

                    return getOriginalIndex(a) - getOriginalIndex(b);
                });
            }

            // --- LAYOUT SETTINGS LOGIC ---
            function applyMasonryLayout() {
                const allElements = Array.from(gallery.children);
                const containerWidth = gallery.offsetWidth;
                const columnCount = getResponsiveColumnCount();
                const gutterSize = 15;
                const cardWidth = (containerWidth - (gutterSize * (columnCount - 1))) / columnCount;
                const columnHeights = new Array(columnCount).fill(0);

                allElements.forEach(element => {
                    if (element.classList.contains('filter-separator')) {
                        const currentMaxHeight = Math.max(...columnHeights);
                        element.style.position = 'absolute';
                        element.style.left = '0';
                        element.style.top = currentMaxHeight + 'px';
                        element.style.width = '100%';

                        const separatorHeight = element.offsetHeight || 60;
                        for (let col = 0; col < columnCount; col++) {
                            columnHeights[col] = currentMaxHeight + separatorHeight + gutterSize + 50;
                        }
                    } else if (element.classList.contains('media-card')) {
                        if (element.style.display === 'none') {
                            return;
                        }

                        const shortestCol = columnHeights.indexOf(Math.min(...columnHeights));
                        const left = shortestCol * (cardWidth + gutterSize);
                        element.style.position = 'absolute';
                        element.style.left = left + 'px';
                        element.style.width = cardWidth + 'px';
                        element.style.top = columnHeights[shortestCol] + 'px';

                        const cardHeight = element.offsetHeight;
                        columnHeights[shortestCol] += cardHeight + gutterSize;
                    }
                });

                gallery.style.height = Math.max(...columnHeights) + 'px';
            }

            // --- DYNAMIC ASPECT RATIO CALCULATION FOR IMAGES ---
            function adjustImageAspectRatios() {
                const imageCards = document.querySelectorAll('.media-card[data-media-type="image"]');

                imageCards.forEach(card => {
                    const img = card.querySelector('img');
                    const aspectBox = card.querySelector('.aspect-ratio-box, .aspect-ratio-box-vertical');

                    if (img && aspectBox) {
                        // If image is already loaded, adjust immediately
                        if (img.complete && img.naturalWidth > 0) {
                            adjustAspectRatio(img, aspectBox);
                        } else {
                            // Wait for image to load
                            img.addEventListener('load', function() {
                                adjustAspectRatio(img, aspectBox);
                                // Recalculate masonry layout after aspect ratio change
                                setTimeout(applyMasonryLayout, 50);
                            });
                        }
                    }
                });
            }

            function adjustAspectRatio(img, aspectBox) {
                const naturalWidth = img.naturalWidth;
                const naturalHeight = img.naturalHeight;

                if (naturalWidth > 0 && naturalHeight > 0) {
                    const aspectRatio = naturalHeight / naturalWidth;
                    const paddingBottom = aspectRatio * 100;

                    // Apply dynamic aspect ratio
                    aspectBox.style.paddingBottom = paddingBottom + '%';

                    // Ensure image fills the container properly
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain'; // Changed from 'cover' to 'contain' to prevent cropping
                }
            }

            // Initialize aspect ratio adjustments
            adjustImageAspectRatios();

            // Function to dynamically adjust modal image size to prevent letterboxing
            function adjustModalImageSize(img, container) {
                if (!img || !container) return;

                const containerRect = container.getBoundingClientRect();
                const containerWidth = containerRect.width;
                const containerHeight = containerRect.height;

                // Check modal orientation to determine border-radius
                const modal = document.getElementById('postModal');
                const isHorizontal = modal.classList.contains('horizontal');
                const isSquareVertical = modal.classList.contains('square-vertical');
                const isVertical4x5 = modal.classList.contains('vertical-4x5');
                const isMobile = window.innerWidth <= 768;

                // Reset image styles first
                img.style.width = 'auto';
                img.style.height = 'auto';
                img.style.maxWidth = 'none';
                img.style.maxHeight = 'none';
                img.style.objectFit = 'contain';

                // Apply border-radius based on modal orientation
                if (isHorizontal || ((isSquareVertical || isVertical4x5) && isMobile)) {
                    // Horizontal modals: round top corners only (no bottom rounding)
                    img.style.borderRadius = '8px 8px 0 0';
                } else {
                    // Vertical modals: round left corners only (no right rounding)
                    img.style.borderRadius = '8px 0 0 8px';
                }

                // Get natural image dimensions
                const naturalWidth = img.naturalWidth;
                const naturalHeight = img.naturalHeight;

                if (naturalWidth && naturalHeight && containerWidth > 0 && containerHeight > 0) {
                    const imageAspectRatio = naturalWidth / naturalHeight;
                    const containerAspectRatio = containerWidth / containerHeight;

                    // Calculate optimal dimensions to fill container without letterboxing
                    let optimalWidth, optimalHeight;

                    if (imageAspectRatio > containerAspectRatio) {
                        // Image is proportionally wider than container - constrain by width
                        optimalWidth = containerWidth;
                        optimalHeight = containerWidth / imageAspectRatio;
                    } else {
                        // Image is proportionally taller than container - constrain by height
                        optimalHeight = containerHeight;
                        optimalWidth = containerHeight * imageAspectRatio;
                    }

                    // Apply optimal dimensions with safeguards
                    img.style.width = Math.max(optimalWidth, 1) + 'px';
                    img.style.height = Math.max(optimalHeight, 1) + 'px';
                    img.style.maxWidth = containerWidth + 'px';
                    img.style.maxHeight = containerHeight + 'px';

                    // Ensure proper centering and positioning
                    img.style.position = 'relative';
                    img.style.display = 'block';
                    img.style.margin = '0 auto';

                    // For mobile, only apply minimal constraints to prevent extreme overflow
                    if (isMobile) {
                        // Only constrain if image would exceed viewport significantly
                        const viewportWidth = window.innerWidth;
                        const viewportHeight = window.innerHeight;

                        if (optimalWidth > viewportWidth - 20) {
                            img.style.width = (viewportWidth - 20) + 'px';
                            img.style.height = (viewportWidth - 20) / imageAspectRatio + 'px';
                        }

                        if (optimalHeight > viewportHeight - 150) {
                            img.style.height = (viewportHeight - 150) + 'px';
                            img.style.width = (viewportHeight - 150) * imageAspectRatio + 'px';
                        }
                    }
                } else {
                    // Fallback for missing dimensions or container issues
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                    img.style.display = 'block';
                    img.style.margin = '0 auto';
                }
            }

            // Function to ensure grouped images have consistent visual width without letterboxing
            function adjustGroupedImageSizes(container) {

                        // Apply border-radius only to the first image, remove from subsequent images

                    if (promptContainer && promptContainer.classList.contains('collapsed')) {

                    }

                    try {

                        showCopyTooltip(clickablePrompt, 'Скопировано');

                        console.error('Failed to copy text: ', err);
                        // Fallback for older browsers
                        const textArea = document.createElement('textarea');
                        textArea.value = textToCopy;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        showCopyTooltip(clickablePrompt, 'Скопировано');

                if (expandToggle) {
                    e.preventDefault();
                    const promptContainer = expandToggle.previousElementSibling;
                    if (promptContainer && promptContainer.classList.contains('prompt-container')) {
                        const isExpanded = promptContainer.classList.contains('expanded');

                }

                // Create tooltip element
                const tooltip = document.createElement('div');
                tooltip.className = 'copy-tooltip';
                tooltip.textContent = message;

                // Position tooltip above the element
                const rect = element.getBoundingClientRect();
                const modalRect = postModal.getBoundingClientRect();

                tooltip.style.position = 'absolute';
                tooltip.style.left = (rect.left - modalRect.left + rect.width / 2 - 60) + 'px'; // Center on element
                tooltip.style.top = (rect.top - modalRect.top + rect.height / 2 - 8) + 'px'; // Center on element

                // Add to modal
                postModal.appendChild(tooltip);

                // Trigger animation
                requestAnimationFrame(() => {
                    tooltip.classList.add('visible');
                });

                // Remove tooltip after animation
                setTimeout(() => {
                    tooltip.classList.add('fade-out');
                    setTimeout(() => {
                        if (tooltip.parentNode) {
                            tooltip.parentNode.removeChild(tooltip);
                        }
                    }, 200); // Match CSS transition duration
                }, 1500); // Show for 1.5 seconds
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.getRegistrations()
                    .then(function(registrations) {
                        return Promise.all(registrations.map(function(registration) {
                            return registration.unregister();
                        }));
                    })
                    .catch(function(error) {
                        console.log('[SW] Unregister failed:', error);
                    });

                if ('caches' in window) {
                    caches.keys()
                        .then(function(cacheNames) {
                            return Promise.all(
                                cacheNames
                                    .filter(function(cacheName) {
                                        return cacheName.startsWith('portfolio-');
                                    })
                                    .map(function(cacheName) {
                                        return caches.delete(cacheName);
                                    })
                            );
                        })
                        .catch(function(error) {
                            console.log('[SW] Cache cleanup failed:', error);
                        });
                }
            });
        }
    </script>
</body>
</html>
